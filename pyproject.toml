[project]
name = "evolink-nodes"
description = "Official EvoLink nodes for ComfyUI. Text-to-image & image-to-image with GPT Image 2 — no local GPU, no third-party image hosting, API key stays out of your workflow JSON. Powered by the EvoLink API platform (150+ models: Nano Banana 2, Seedream 5, Sora 2, Veo 3.1, Kling, Seedance, Midjourney, Suno — image/video/audio/LLM via one API key; more nodes coming soon). 国内直连，中文支持。"
version = "1.0.3"
license = { text = "MIT License" }
dependencies = ["requests"]

[project.urls]
Repository = "https://github.com/deeplearning-goethe/comfyui-evolink"
Documentation = "https://evolink.ai/docs/cn/integration-guide/comfyui"

[tool.comfy]
PublisherId = "evolink"
DisplayName = "EvoLink (Official)"
Icon = "https://raw.githubusercontent.com/deeplearning-goethe/comfyui-evolink/main/assets/icon.png"
Banner = "https://raw.githubusercontent.com/deeplearning-goethe/comfyui-evolink/main/assets/banner.png"
